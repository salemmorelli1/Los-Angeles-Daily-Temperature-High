name: Daily LA Temperature Forecast

# Two UTC cron occurrences target 06:35 Pacific across PDT/PST. The selector
# uses the triggering expression and the current Pacific offset, so a delayed
# job still executes and only the opposing-DST occurrence is skipped.
on:
  schedule:
    - cron: "35 13 * * *"   # 6:35 AM PDT (UTC-7, summer)
    - cron: "35 14 * * *"   # 6:35 AM PST (UTC-8, winter)
  workflow_dispatch:
    inputs:
      retrain:
        description: "Force Part 2 model retraining"
        required: false
        default: false
        type: boolean
      model:
        description: "Part 2 model backbone"
        required: false
        default: "lstm"
        type: choice
        options:
          - lstm
          - transformer

permissions:
  contents: write

concurrency:
  group: latemp-production
  cancel-in-progress: false

env:
  LATEMP_ROOT: ${{ github.workspace }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  forecast:
    name: Run daily forecast pipeline
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Synchronize the complete checkout before using cached artifacts
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}"
          git merge --ff-only "origin/${GITHUB_REF_NAME}"

      # ── Gate key consistency guard ─────────────────────────────────────
      # REQUIRED: the gate step below writes exactly one output key ("run").
      # Every downstream if: condition must reference that same key via
      # steps.gate.outputs.<key>. A mismatch makes those conditions evaluate
      # as empty-string (falsy), silently skipping the whole pipeline while
      # the workflow still exits green -- this is exactly the failure mode
      # the timezone-key bug above produced. This step greps the workflow
      # file at runtime and fails loudly, before the gate runs, if they
      # disagree. Derives the workflow file path from the GitHub-injected
      # GITHUB_WORKFLOW_REF so it works regardless of this file's name/path.
      - name: Verify gate output key is consistent throughout workflow
        run: |
          WORKFLOW_FILE="${GITHUB_WORKSPACE}/$(echo "${GITHUB_WORKFLOW_REF}" | sed 's|[^/]*/[^/]*/||; s|@.*||')"

          WRITTEN_KEY=$(grep -oP '(?<=f\.write\(")[a-z_]+(?==)' "$WORKFLOW_FILE" | head -1)
          if [ -z "$WRITTEN_KEY" ]; then
            echo "ERROR: Could not extract gate output key from $WORKFLOW_FILE"
            exit 1
          fi
          echo "Gate writes output key: '${WRITTEN_KEY}'"

          CORRECT=$(grep -c "steps\.gate\.outputs\.${WRITTEN_KEY}" "$WORKFLOW_FILE" || true)
          WRONG=$(grep -cP "steps\.gate\.outputs\.(?!${WRITTEN_KEY})[a-z_]+" "$WORKFLOW_FILE" || true)

          echo "Downstream conditions using '${WRITTEN_KEY}': ${CORRECT}"
          echo "Downstream conditions using a different key:  ${WRONG}"

          if [ "$WRONG" -ne 0 ]; then
            echo ""
            echo "FATAL: gate output key mismatch — downstream steps will be silently skipped."
            grep -nP "steps\.gate\.outputs\." "$WORKFLOW_FILE"
            exit 1
          fi
          echo "OK: gate key '${WRITTEN_KEY}' is consistent throughout the workflow."

      # ── DST schedule selector ─────────────────────────────────────────
      # Select by the triggering cron expression, not wall-clock start time.
      # This remains correct even when GitHub starts a queued schedule hours
      # late, which previously produced a green run with every real step skipped.
      - name: Select Pacific DST-matched schedule
        id: gate
        run: |
          python - <<'PYEOF'
          import json
          import os
          import sys
          from datetime import datetime
          from zoneinfo import ZoneInfo

          event = os.environ.get("GITHUB_EVENT_NAME", "")
          if event == "workflow_dispatch":
              print("Manual dispatch — skipping schedule selector.")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("run=true\n")
              sys.exit(0)

          now = datetime.now(ZoneInfo("America/Los_Angeles"))
          offset_hours = int(now.utcoffset().total_seconds() // 3600)
          expected_schedule = "35 13 * * *" if offset_hours == -7 else "35 14 * * *"

          with open(os.environ["GITHUB_EVENT_PATH"]) as f:
              triggering_schedule = str(json.load(f).get("schedule", "")).strip()

          should_run = triggering_schedule == expected_schedule
          print(
              f"Pacific time: {now.strftime('%Y-%m-%d %H:%M %Z')} | "
              f"trigger={triggering_schedule!r} | expected={expected_schedule!r} | "
              f"run={should_run}"
          )

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"run={'true' if should_run else 'false'}\n")

          if not should_run:
              print("Opposing-DST cron selected — suppressing duplicate run.")
          PYEOF

      - name: Set up Python
        if: steps.gate.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Create isolated Python environment
        if: steps.gate.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          python - <<'PYENV'
          import os
          import subprocess
          import sys
          from pathlib import Path
          directory = Path(os.environ["GITHUB_WORKSPACE"]) / ".venv"
          subprocess.run([sys.executable, "-m", "venv", str(directory)], check=True)
          binaries = directory / ("Scripts" if os.name == "nt" else "bin")
          with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as stream:
              stream.write(str(binaries) + "\n")
          PYENV

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          python -m pip install --upgrade pip
          # Use the same pinned CPU stack verified by Linux/Windows CI.
          pip install -r requirements-ci-lock.txt
          pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip check

      - name: Decide run arguments
        id: args
        if: steps.gate.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          MODEL="${{ github.event.inputs.model || 'lstm' }}"
          RETRAIN="${{ github.event.inputs.retrain || 'false' }}"

          ARGS="--model ${MODEL}"
          if [ "$RETRAIN" = "true" ]; then
            ARGS="$ARGS --retrain"
          fi

          echo "args=${ARGS}" >> "$GITHUB_OUTPUT"
          echo "Run arguments: ${ARGS}"

      - name: Run full daily pipeline
        if: steps.gate.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          python run_daily_forecast.py ${{ steps.args.outputs.args }}

      - name: Run artifact contract validator
        if: steps.gate.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          python validate_artifacts.py
          echo "✅ Artifact contract validation passed."

      - name: Verify required artifacts
        id: verify
        if: always() && (steps.gate.outputs.run == 'true' || github.event_name == 'workflow_dispatch')
        run: |
          missing=0
          for path in \
            artifacts_part0/data_meta.json \
            artifacts_part0/historical_daily.parquet \
            artifacts_part1/feature_matrix.parquet \
            artifacts_part1/train_val_test_split.json \
            artifacts_part2/prediction_log.csv \
            artifacts_part2/part2_meta.json \
            artifacts_part2/feature_scaler.pkl \
            artifacts_part2/target_scaler.pkl \
            artifacts_part2a/alpha_meta.json \
            artifacts_part2a/alpha_features.parquet \
            artifacts_part3/governance_report.json \
            artifacts_part3/governance_history.parquet \
            artifacts_part6/regime_meta.json \
            artifacts_part6/regime_tape.parquet \
            artifacts_part9/live_attribution_report.json
          do
            if [ -f "$path" ]; then
              echo "OK: $path"
            else
              echo "MISSING: $path"
              missing=$((missing + 1))
            fi
          done
          echo "missing=$missing" >> "$GITHUB_OUTPUT"

      - name: Fail if required artifacts are missing
        if: >
          (steps.gate.outputs.run == 'true' || github.event_name == 'workflow_dispatch') &&
          steps.verify.outputs.missing != '0'
        run: |
          echo "Required artifacts are missing. Aborting artifact commit."
          exit 1

      # Pages follows successful workflow completion, including bot commits.
      - name: Commit and push forecast artifacts
        if: steps.gate.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          # Never merge a stale model/ledger bundle over a concurrent update.
          git fetch origin "${GITHUB_REF_NAME}"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "origin/${GITHUB_REF_NAME}")"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -f \
            artifacts_part0/ \
            artifacts_part1/ \
            artifacts_part2/ \
            artifacts_part2a/ \
            artifacts_part3/ \
            artifacts_part6/ \
            artifacts_part9/

          for path in artifacts_part2b artifacts_part2c; do
            if [ -d "$path" ]; then git add -f -- "$path/"; fi
          done

          if git diff --cached --quiet; then
            echo "No artifact changes to commit."
            exit 0
          fi

          git commit -m "Update LA temperature forecast artifacts"

          git push origin HEAD:"${GITHUB_REF_NAME}"
