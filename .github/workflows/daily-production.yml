name: Daily LA Temperature Forecast

# FIX (audit): the schedule trigger used
#
#     - cron: "35 6 * * *"
#       timezone: "America/Los_Angeles"
#
# GitHub Actions schedule triggers on github.com do NOT support a `timezone`
# key (this is the same root cause documented in both reference projects as
# the "S60" finding). The field is silently ignored, so this cron fired at
# 06:35 UTC every day regardless -- 11:35 PM PDT / 10:35 PM PST the PREVIOUS
# day, hours before LA's day even starts, let alone before that day's high
# is known or NWS/Open-Meteo data is fresh. Every scheduled run was anchored
# to the wrong day.
#
# Fix: the proven dual-cron UTC pattern already used by the reference
# projects. Target time: 6:35 AM Pacific.
#   6:35 AM PDT (UTC-7, ~Mar-Nov) = 13:35 UTC  -> cron: "35 13 * * *"
#   6:35 AM PST (UTC-8, ~Nov-Mar) = 14:35 UTC  -> cron: "35 14 * * *"
# Both crons fire every day; a Python time gate passes the one landing in
# the 6:00-9:00 AM Pacific window (180 minutes -- comfortable room for
# GitHub scheduler drift) and suppresses the opposing-DST-season duplicate.
# Manual workflow_dispatch runs bypass the gate entirely.
on:
  schedule:
    - cron: "35 13 * * *"   # 6:35 AM PDT (UTC-7, summer)
    - cron: "35 14 * * *"   # 6:35 AM PST (UTC-8, winter)
  workflow_dispatch:
    inputs:
      retrain:
        description: "Force Part 2 model retraining"
        required: false
        default: false
        type: boolean
      model:
        description: "Part 2 model backbone"
        required: false
        default: "lstm"
        type: choice
        options:
          - lstm
          - transformer

permissions:
  contents: write

concurrency:
  group: latemp-production
  cancel-in-progress: false

env:
  LATEMP_ROOT: ${{ github.workspace }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  forecast:
    name: Run daily forecast pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ── Gate key consistency guard ─────────────────────────────────────
      # REQUIRED: the gate step below writes exactly one output key ("run").
      # Every downstream if: condition must reference that same key via
      # steps.gate.outputs.<key>. A mismatch makes those conditions evaluate
      # as empty-string (falsy), silently skipping the whole pipeline while
      # the workflow still exits green -- this is exactly the failure mode
      # the timezone-key bug above produced. This step greps the workflow
      # file at runtime and fails loudly, before the gate runs, if they
      # disagree. Derives the workflow file path from the GitHub-injected
      # GITHUB_WORKFLOW_REF so it works regardless of this file's name/path.
      - name: Verify gate output key is consistent throughout workflow
        run: |
          WORKFLOW_FILE="${GITHUB_WORKSPACE}/$(echo "${GITHUB_WORKFLOW_REF}" | sed 's|[^/]*/[^/]*/||; s|@.*||')"

          WRITTEN_KEY=$(grep -oP '(?<=f\.write\(")[a-z_]+(?==)' "$WORKFLOW_FILE" | head -1)
          if [ -z "$WRITTEN_KEY" ]; then
            echo "ERROR: Could not extract gate output key from $WORKFLOW_FILE"
            exit 1
          fi
          echo "Gate writes output key: '${WRITTEN_KEY}'"

          CORRECT=$(grep -c "steps\.gate\.outputs\.${WRITTEN_KEY}" "$WORKFLOW_FILE" || true)
          WRONG=$(grep -cP "steps\.gate\.outputs\.(?!${WRITTEN_KEY})[a-z_]+" "$WORKFLOW_FILE" || true)

          echo "Downstream conditions using '${WRITTEN_KEY}': ${CORRECT}"
          echo "Downstream conditions using a different key:  ${WRONG}"

          if [ "$WRONG" -ne 0 ]; then
            echo ""
            echo "FATAL: gate output key mismatch — downstream steps will be silently skipped."
            grep -nP "steps\.gate\.outputs\." "$WORKFLOW_FILE"
            exit 1
          fi
          echo "OK: gate key '${WRITTEN_KEY}' is consistent throughout the workflow."

      # ── Time gate ─────────────────────────────────────────────────────
      # Both crons fire every day; the gate passes the one landing in the
      # 6:00-9:00 AM Pacific window (typically the summer cron in PDT
      # months, the winter cron in PST months) and suppresses the
      # out-of-window duplicate. Manual dispatches always proceed.
      - name: Check run window (6:00-9:00 AM Pacific)
        id: gate
        run: |
          python - <<'PYEOF'
          import sys, os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          event = os.environ.get("GITHUB_EVENT_NAME", "")
          if event == "workflow_dispatch":
              print("Manual dispatch — skipping time gate.")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("run=true\n")
              sys.exit(0)

          now = datetime.now(ZoneInfo("America/Los_Angeles"))
          hour, minute = now.hour, now.minute

          # 6:00-9:00 AM Pacific: covers the 6:35 AM nominal trigger with up
          # to 180 minutes of GitHub scheduler drift. Suppresses the
          # out-of-window duplicate cron (the one for the opposing DST season).
          in_window = 6 <= hour < 9
          print(f"Pacific time: {now.strftime('%Y-%m-%d %H:%M')} in_window={in_window}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"run={'true' if in_window else 'false'}\n")

          if not in_window:
              print("Outside 6:00-9:00 AM Pacific window — skipping run.")
          PYEOF

      - name: Set up Python
        if: steps.gate.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          python -m pip install --upgrade pip
          # Keep production CPU-only. requirements.txt pins xgboost<2.0 to avoid
          # nvidia-nccl-cu12/GPU dependency pulls on GitHub Actions.
          grep -vE '^torch([<>=! ].*)?$' requirements.txt > /tmp/requirements-no-torch.txt
          pip install -r /tmp/requirements-no-torch.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      # ── Restore accumulated artifacts from remote ────────────────────────
      # actions/checkout resolves github.sha at trigger/queue time, not at
      # step-execution time. Because this workflow shares the
      # latemp-production concurrency group with daily-backfill.yml,
      # a run queued while the other is still finishing can execute against
      # a workspace snapshot that is behind what the other just pushed.
      # Restoring every accumulating artifact from origin immediately before
      # use guards against silently appending to (or overwriting with) a
      # stale copy.
      #
      # FIX: added artifacts_part0/historical_daily.parquet. It was
      # previously missing here even though daily-backfill.yml already
      # restores it -- the same "Finding C" accumulating-artifact gap from
      # both reference projects, just on a third artifact. Part 0's
      # incremental fetch reads whatever is on disk to compute its start
      # date, so a stale local copy here risks redundant refetching at best
      # and, if origin has since moved further ahead, a concat-then-commit
      # that rolls the historical archive back to the stale version at worst.
      - name: Restore accumulated artifacts from remote
        if: steps.gate.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git fetch origin "${GITHUB_REF_NAME}" --quiet || true

          for path in \
            artifacts_part0/historical_daily.parquet \
            artifacts_part2/prediction_log.csv \
            artifacts_part2/part2_meta.json \
            artifacts_part2/lstm_model.pt \
            artifacts_part2/transformer_model.pt \
            artifacts_part2/feature_scaler.pkl \
            artifacts_part2/target_scaler.pkl \
            artifacts_part3/governance_history.parquet \
            artifacts_part9/live_attribution_report.json \
            artifacts_part9/attribution_tape.parquet \
            artifacts_part9/skill_history.parquet
          do
            git checkout "origin/${GITHUB_REF_NAME}" -- "$path" 2>/dev/null || true
          done

      - name: Decide run arguments
        id: args
        if: steps.gate.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          MODEL="${{ github.event.inputs.model || 'lstm' }}"
          RETRAIN="${{ github.event.inputs.retrain || 'false' }}"

          ARGS="--model ${MODEL}"
          if [ "$RETRAIN" = "true" ]; then
            ARGS="$ARGS --retrain"
          fi

          echo "args=${ARGS}" >> "$GITHUB_OUTPUT"
          echo "Run arguments: ${ARGS}"

      - name: Run full daily pipeline
        if: steps.gate.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          python run_daily_forecast.py ${{ steps.args.outputs.args }}

      - name: Run artifact contract validator
        if: steps.gate.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          python validate_artifacts.py
          echo "✅ Artifact contract validation passed."

      - name: Verify required artifacts
        id: verify
        if: always() && (steps.gate.outputs.run == 'true' || github.event_name == 'workflow_dispatch')
        run: |
          missing=0
          for path in \
            artifacts_part0/data_meta.json \
            artifacts_part0/historical_daily.parquet \
            artifacts_part1/feature_matrix.parquet \
            artifacts_part1/train_val_test_split.json \
            artifacts_part2/prediction_log.csv \
            artifacts_part2/part2_meta.json \
            artifacts_part2/feature_scaler.pkl \
            artifacts_part2/target_scaler.pkl \
            artifacts_part2a/alpha_meta.json \
            artifacts_part2a/alpha_features.parquet \
            artifacts_part3/governance_report.json \
            artifacts_part3/governance_history.parquet \
            artifacts_part6/regime_meta.json \
            artifacts_part6/regime_tape.parquet \
            artifacts_part9/live_attribution_report.json
          do
            if [ -f "$path" ]; then
              echo "OK: $path"
            else
              echo "MISSING: $path"
              missing=$((missing + 1))
            fi
          done
          echo "missing=$missing" >> "$GITHUB_OUTPUT"

      - name: Fail if required artifacts are missing
        if: >
          (steps.gate.outputs.run == 'true' || github.event_name == 'workflow_dispatch') &&
          steps.verify.outputs.missing != '0'
        run: |
          echo "Required artifacts are missing. Aborting artifact commit."
          exit 1

      # NOTE: no [skip ci] on this commit message -- this is what triggers
      # pages.yml to redeploy the dashboard after a successful production
      # run (mirrors the reference projects' S60 F1 fix). daily-backfill.yml
      # keeps [skip ci] intentionally since it only patches realized-value
      # columns, not a new decision.
      - name: Commit and push forecast artifacts
        if: steps.gate.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -f \
            artifacts_part0/ \
            artifacts_part1/ \
            artifacts_part2/ \
            artifacts_part2a/ \
            artifacts_part3/ \
            artifacts_part6/ \
            artifacts_part9/ || true

          git add -f artifacts_part2b/ 2>/dev/null || true
          git add -f artifacts_part2c/ 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No artifact changes to commit."
            exit 0
          fi

          git commit -m "Update LA temperature forecast artifacts"

          git pull origin "${GITHUB_REF_NAME}" \
            --no-rebase \
            --strategy-option=ours \
            --no-edit || true

          git push origin HEAD:"${GITHUB_REF_NAME}"
