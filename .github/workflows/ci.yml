name: CI

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "artifacts_part*/**"
      - "*.md"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "artifacts_part*/**"
      - "*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: latemp-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: CPU regression and model integration (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Check out repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci-lock.txt

      - name: Install the tested CPU stack
        run: |
          python -m pip install --disable-pip-version-check torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check -r requirements-ci-lock.txt
          python -m pip check

      - name: Compile and lint project code
        run: |
          python -m compileall -q *.py tests
          python -m ruff check --select E9,F63,F7,F82 .

      - name: Check CLI interfaces
        run: |
          python run_daily_forecast.py --help
          python part2_deep_learning_forecaster.py --help
          python part6_weather_regime_engine.py --help

      - name: Run regression and real model integration tests
        run: |
          python -c "import torch, hmmlearn, xgboost; print('CPU model dependencies available')"
          python -m unittest discover -s tests -v

      - name: Validate retained artifact contracts
        run: python validate_artifacts.py

      - name: Verify checks did not rewrite committed forecasts
        run: |
          git diff --check
          git diff --exit-code
