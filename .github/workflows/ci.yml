name: CI

on:
  push:
    branches: ["main", "codex/**"]
    paths-ignore:
      - "artifacts_part*/**"
      - "*.md"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "artifacts_part*/**"
      - "*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: latemp-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: CPU regression and model integration (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Check out repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci-lock.txt

      - name: Create isolated Python environment
        shell: bash
        run: |
          python - <<'PYENV'
          import os
          import subprocess
          import sys
          from pathlib import Path
          directory = Path(os.environ["GITHUB_WORKSPACE"]) / ".venv"
          subprocess.run([sys.executable, "-m", "venv", str(directory)], check=True)
          binaries = directory / ("Scripts" if os.name == "nt" else "bin")
          with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as stream:
              stream.write(str(binaries) + "\n")
          PYENV

      - name: Install locked runtimes and run the delivered verification script
        run: bash verify_audit.sh
