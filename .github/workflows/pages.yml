name: Deploy GitHub Pages

on:
  workflow_run:
    workflows: ["Daily LA Temperature Forecast", "Daily Realized Temperature Backfill"]
    types: [completed]
    branches: [main]
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "report/**"
      - "assets/**"
      - ".github/workflows/pages.yml"
      - "build_dashboard.py"
      - "deploy_pages.py"
      - "part9_live_attribution.py"
      - "forecast_protocol.py"
      - "requirements-publication-lock.txt"
      - "artifacts_part0/**"
      - "artifacts_part1/**"
      - "artifacts_part2/**"
      - "artifacts_part2a/**"
      - "artifacts_part2b/**"
      - "artifacts_part2c/**"
      - "artifacts_part3/**"
      - "artifacts_part6/**"
      - "artifacts_part9/**"
  pull_request:
    branches: ["main"]
    paths:
      - "index.html"
      - "report/**"
      - "assets/**"
      - ".github/workflows/pages.yml"
      - "build_dashboard.py"
      - "deploy_pages.py"
      - "part9_live_attribution.py"
      - "forecast_protocol.py"
      - "requirements-publication-lock.txt"
      - "artifacts_part0/**"
      - "artifacts_part1/**"
      - "artifacts_part2/**"
      - "artifacts_part2a/**"
      - "artifacts_part2b/**"
      - "artifacts_part2c/**"
      - "artifacts_part3/**"
      - "artifacts_part6/**"
      - "artifacts_part9/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep preview validation independent from production publication. Never
  # interrupt an active Pages deployment when a writer/PR finishes nearby.
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build static site
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_commit: ${{ steps.source.outputs.commit }}
      artifact_id: ${{ steps.upload.outputs.artifact_id }}

    steps:
      - name: Check out repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # workflow_run.head_sha precedes the writer's artifact commit.
          # Resolve current main once, then build all files from that checkout.
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'main' }}

      - name: Record the exact publication source
        id: source
        shell: bash
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up publication Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-publication-lock.txt

      - name: Create isolated Python environment
        shell: bash
        run: |
          python - <<'PYENV'
          import os
          import subprocess
          import sys
          from pathlib import Path
          directory = Path(os.environ["GITHUB_WORKSPACE"]) / ".venv"
          subprocess.run([sys.executable, "-m", "venv", str(directory)], check=True)
          binaries = directory / ("Scripts" if os.name == "nt" else "bin")
          with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as stream:
              stream.write(str(binaries) + "\n")
          PYENV

      - name: Install locked publication dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-publication-lock.txt
          python -m pip check

      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          python build_dashboard.py --output _site
          python build_dashboard.py --output _site --verify
          git diff --exit-code

      - name: Upload Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    name: Deploy static site
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out the verified publication source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.build.outputs.source_commit }}

      - name: Set up deployment Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Deploy to GitHub Pages
        id: deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          PAGES_SOURCE_COMMIT: ${{ needs.build.outputs.source_commit }}
        run: >-
          python deploy_pages.py
          --artifact-id "$PAGES_ARTIFACT_ID"
          --build-version "$PAGES_SOURCE_COMMIT"
